name: tmp-nli-diag
on:
  pull_request:
    branches: [main]
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - run: python -m rag_lab.ops.fetch_models
      - run: PYTHONPATH=. python tmp_reranker_battery.py
