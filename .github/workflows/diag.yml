name: tmp-nli-diag
on:
  pull_request:
    branches: [main]
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - run: PYTHONPATH=. python tmp_nli_battery.py /tmp/hf out.json
      - run: python -c "import json; d=json.load(open('out.json')); print('SCORES_JSON', json.dumps({k: [round(x,4) for x in v['scores']] for k, v in d['variants'].items()}))"
