name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite (online and offline)
    runs-on: ubuntu-24.04

    env:
      # Tests run on throwaway SQLite stores; this server backs the PostgreSQL checkpointer tests.
      # Credentials of a throwaway service container that exists only for this run; real deployments use .env.
      POSTGRES_TEST_URI: postgresql://rag_user:rag_password@localhost:5432/rag_checkpoints
      # The scaling options (docs/scaling.md) are tested against real servers; a missing one fails the run (REQUIRE_*).
      QDRANT_TEST_URL: http://localhost:6333
      PGVECTOR_TEST_URI: postgresql://rag_user:rag_password@localhost:5433/rag_vectors

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rag_checkpoints
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_checkpoints"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333

      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_vectors
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_vectors"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install maturin
          pip install "qdrant-client>=1.9"  # optional: the Qdrant adapter is tested here

      - name: Lint (ruff, rule set pinned in pyproject.toml)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy rag_lab

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install native Rust accelerator
        run: |
          maturin build --release --locked -m crates/rag_accel/Cargo.toml
          pip install crates/rag_accel/target/wheels/*.whl

      - name: Restore embedding model cache
        uses: actions/cache@v6
        with:
          path: models
          key: embedding-model-${{ hashFiles('model_integrity.py') }}

      - name: Fetch and verify pinned model weights
        run: python -m rag_lab.ops.fetch_models

      - name: Run test suite (PostgreSQL integration included)
        env:
          # A missing PostgreSQL server or Rust accelerator fails the run instead of skipping its tests.
          REQUIRE_POSTGRES: "1"
          REQUIRE_RUST_ACCEL: "1"
          REQUIRE_QDRANT: "1"
          REQUIRE_PGVECTOR: "1"
          # The accelerator is the default here: a missing one stops the process instead of falling back.
          RAG_ACCEL: required
        run: pytest -v --cov=. --cov-report=term-missing:skip-covered

      - name: Run test suite with all outbound network blocked
        env:
          RAG_OFFLINE: "1"
          REQUIRE_POSTGRES: "1"
          REQUIRE_RUST_ACCEL: "1"
          REQUIRE_QDRANT: "1"
          REQUIRE_PGVECTOR: "1"
          RAG_ACCEL: required
        run: pytest -v
