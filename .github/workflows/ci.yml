name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite (online and offline)
    runs-on: ubuntu-latest

    env:
      DB_URI: postgresql://rag_user:rag_password@localhost:5432/rag_checkpoints

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rag_checkpoints
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_checkpoints"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore embedding model cache
        uses: actions/cache@v4
        with:
          path: models
          key: embedding-model-${{ hashFiles('model_integrity.py') }}

      - name: Fetch and verify pinned model weights
        run: python fetch_models.py

      - name: Run test suite (PostgreSQL integration included)
        run: pytest -v

      - name: Run test suite with all outbound network blocked
        env:
          RAG_OFFLINE: "1"
        run: pytest -v
