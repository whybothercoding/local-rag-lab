[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-lab"
version = "0.1.0"
description = "Air-gapped Compound AI retrieval and compliance engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Local RAG Lab Contributors"}
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "langgraph",
    "air-gapped",
    "security",
    "zero-trust",
    "onnx",
    "cross-encoder",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "langgraph>=1.1.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "fastembed>=0.9.0",
    "huggingface-hub>=0.25.0",
    "PyYAML>=6.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "cryptography>=43.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "streamlit>=1.53.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "watchdog>=4.0.0",
    "setuptools>=61.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
]
rust = [
    "maturin>=1.7.0",
]

[project.scripts]
local-rag = "rag_lab.storage.workspace_manager:main"
local-rag-sync = "rag_lab.ingestion.ingest:main"
local-rag-access = "rag_lab.security.access:main"
local-rag-audit = "rag_lab.security.audit:main"
local-rag-approve = "rag_lab.ops.approve:main"
local-rag-eval = "rag_lab.ops.eval:main"
local-rag-retention = "rag_lab.storage.retention:main"
local-rag-backup = "rag_lab.storage.backup:main"
local-rag-models = "rag_lab.ops.fetch_models:main"
local-rag-graph = "rag_lab.ops.export_graph:main"

[project.urls]
Homepage = "https://github.com/whybothercoding/local-rag-lab"
Repository = "https://github.com/whybothercoding/local-rag-lab.git"
Documentation = "https://github.com/whybothercoding/local-rag-lab#readme"

[tool.setuptools.packages.find]
include = ["rag_lab*"]

[tool.setuptools.package-data]
"rag_lab.security" = ["common_passwords.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith.*",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.*",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    "venv",
    "chroma_data",
    "crates",
    "models",
    "backups",
    "eval/out",
]

[tool.ruff.lint]
# Pinned explicitly: newer ruff releases widen the default rule set, which would change the gate silently.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# eval.py must point every store at eval/out/ before the project modules are imported.
"rag_lab/ops/eval.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
