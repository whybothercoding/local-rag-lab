[pytest]
# Test discovery and execution defaults
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --strict-markers

# Suppress known upstream third-party deprecation warnings
filterwarnings =
    # Ignore upstream asyncio.iscoroutinefunction deprecation warnings from LangSmith & ChromaDB on Python 3.14
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith.*
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.*
    # General fallback for any remaining third-party iscoroutinefunction warnings
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
